<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Gradiente de alta tecnología -->
    <linearGradient id="techGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#E27338"/>
      <stop offset="45%" stop-color="#D926A9"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTIPO: Esfera geométrica / Red neural -->
  <g transform="translate(20, 10)">
    <!-- Líneas internas -->
    <g stroke="url(#techGrad)" stroke-width="1.2" opacity="0.85">
      <!-- Círculo exterior y estructura principal -->
      <polygon points="70,10 115,30 135,70 120,115 80,135 35,120 10,75 25,30" fill="none"/>
      
      <!-- Conexiones internas -->
      <line x1="70" y1="10" x2="60" y2="50"/>
      <line x1="115" y1="30" x2="85" y2="65"/>
      <line x1="135" y1="70" x2="95" y2="85"/>
      <line x1="120" y1="115" x2="80" y2="95"/>
      <line x1="80" y1="135" x2="60" y2="100"/>
      <line x1="35" y1="120" x2="45" y2="80"/>
      <line x1="10" y1="75" x2="40" y2="55"/>
      <line x1="25" y1="30" x2="60" y2="50"/>

      <!-- Red interna -->
      <polygon points="60,50 85,65 95,85 80,95 60,100 45,80 40,55" fill="none"/>
      <line x1="60" y1="50" x2="95" y2="85"/>
      <line x1="85" y1="65" x2="60" y2="100"/>
      <line x1="40" y1="55" x2="80" y2="95"/>
      <line x1="45" y1="80" x2="70" y2="10"/>
      <line x1="85" y1="65" x2="135" y2="70"/>
      <line x1="95" y1="85" x2="35" y2="120"/>
      <line x1="60" y1="50" x2="115" y2="30"/>
      <line x1="60" y1="100" x2="120" y2="115"/>
    </g>

    <!-- Nodos (Vértices) -->
    <g fill="url(#techGrad)">
      <circle cx="70" cy="10" r="3.5"/>
      <circle cx="115" cy="30" r="3"/>
      <circle cx="135" cy="70" r="3.5"/>
      <circle cx="120" cy="115" r="3"/>
      <circle cx="80" cy="135" r="3.5"/>
      <circle cx="35" cy="120" r="3"/>
      <circle cx="10" cy="75" r="3.5"/>
      <circle cx="25" cy="30" r="3"/>
      <circle cx="60" cy="50" r="4"/>
      <circle cx="85" cy="65" r="3"/>
      <circle cx="95" cy="85" r="3.5"/>
      <circle cx="80" cy="95" r="3"/>
      <circle cx="60" cy="100" r="3.5"/>
      <circle cx="45" cy="80" r="3"/>
      <circle cx="40" cy="55" r="3"/>
    </g>
  </g>

  <!-- LOGOTIPO / TEXTO -->
  <!-- "HUX" en primer nivel jerárquico -->
  <text x="185" y="85" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="54" font-weight="900" letter-spacing="4" fill="#ffffff">
    HUX
  </text>
  
  <!-- "TECNOLOGÍA" estilizado como descriptor -->
  <text x="187" y="115" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="10" fill="url(#techGrad)">
    TECNOLOGÍA
  </text>
</svg>